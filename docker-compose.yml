version: '3.8'

services:
  bis-recommendation-engine:
    build: .
    container_name: bis_manak_ai_engine
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/bis_standards.db
      - REQUEST_DELAY_SECONDS=1.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
